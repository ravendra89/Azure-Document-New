name: Deploy Bicep files $(Build.BuildId)

trigger: none

variables:
  location: 'westus2'
  templateFile: "Azure/bicepdeployment-cbhosting/main.bicep"
  parametersFile: "Azure/bicepdeployment-cbhosting/pipelines/test/production/parameters.bicepparam"
  azureSubscription: "CloudOps-TestEnv-(0761e716-cfcc-46c6-9c11-3d78a8c0f432)"

pool:
  vmImage: "ubuntu-latest"

stages:
  - stage: preDeploy
    jobs:
      - job: scanWhatif
        displayName: scan and run whatif
        pool:
          vmImage: windows-2022

        steps:
          - task: RunARMTTKTests@1
            displayName: Scan Bicep files
            inputs:
              templatelocation: '$(System.DefaultWorkingDirectory)\Azure\bicepdeployment-cbhosting'
              resultLocation: '$(System.DefaultWorkingDirectory)\Azure\bicepdeployment-cbhosting\deploymentresults'
              allTemplatesMain: false
              cliOutputResults: true
              ignoreExitCode: true

          - task: PublishTestResults@2
            displayName: Publish Results
            inputs:
              testResultsFormat: "NUnit"
              testResultsFiles: '$(System.DefaultWorkingDirectory)\Azure\bicepdeployment-cbhosting\deploymentresults\*-armttk.xml'
            condition: always()

          - task: AzureCLI@2
            displayName: Preview Bicep Changes
            inputs:
              useGlobalConfig: true
              azureSubscription: $(azureSubscription)
              scriptType: "bash"
              scriptLocation: "inlineScript"
              inlineScript: |
                az bicep uninstall
                az config set bicep.use_binary_from_path=false
                az bicep install
                az deployment sub what-if --location $(location) --template-file $(templateFile) --parameters $(parametersFile)

  - stage: deployBicep
    jobs:
      - job: waitForValidation
        displayName: Wait for external validation
        pool: server
        timeoutInMinutes: 1440 ### job times out in 1 day
        steps:
          - task: ManualValidation@0
            timeoutInMinutes: 1440 ### task times out in 1 day
            inputs:
              notifyUsers: |
                sean.donahoe@communitybrands.com
                ajay.tidake@communitybrands.com
              instructions: "Please validate the build $(Build.BuildId) configuration and resume"
              onTimeout: "reject"

      - job: deployAzure
        displayName: deploy bicep to Azure
        timeoutInMinutes: 1440 ### task times out in 1 day
        pool:
          vmImage: "ubuntu-latest"
        dependsOn: [waitForValidation]

        steps:
          - task: AzureCLI@2
            displayName: Deploy Bicep To Azure
            timeoutInMinutes: 1440 ### task times out in 1 day
            inputs:
              useGlobalConfig: true
              azureSubscription: $(azureSubscription)
              scriptType: "bash"
              scriptLocation: "inlineScript"
              inlineScript: |
                az bicep uninstall
                az config set bicep.use_binary_from_path=false
                az bicep install
                az deployment sub create --location $(location) --template-file $(templateFile) --parameters $(parametersFile)
